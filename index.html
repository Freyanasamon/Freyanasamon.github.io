<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>ABB AlphaGrid</title>
<style>
:root{--bg:#0b1016;--panel:#121923;--panel2:#18212d;--line:#243040;--tx:#e6ebf1;--mut:#92a0b2;
--good:#2ecc8f;--base:#4c9bff;--watch:#ffc233;--risk:#ff4d57;--brand:#ff000f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif}
.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
nav{background:#0e141c;border-right:1px solid var(--line);padding:16px 10px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{font-weight:800;letter-spacing:.4px;padding:2px 8px 16px}.brand b{color:var(--brand)}.brand small{display:block;color:var(--mut);font-weight:400;font-size:12px}
nav a{display:block;padding:9px 12px;border-radius:8px;color:var(--mut);cursor:pointer;margin-bottom:2px}
nav a:hover{background:var(--panel);color:var(--tx)}nav a.on{background:var(--panel2);color:#fff;font-weight:600}
.note{margin:16px 8px 0;font-size:12px;color:var(--mut);border-top:1px solid var(--line);padding-top:12px}
main{padding:20px 26px 48px;min-width:0;max-width:1240px}
h1{font-size:24px;margin:0 0 4px}.sub{color:var(--mut);margin-bottom:18px;max-width:760px}
h2{font-size:17px;margin:26px 0 10px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}
@media(max-width:1000px){.app{grid-template-columns:1fr}nav{position:static;height:auto;padding:8px}.brand{padding:2px 6px 6px}.note{display:none}#menu{display:flex;overflow-x:auto;gap:4px}#menu a{white-space:nowrap;margin:0}.g4,.g3{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.g4,.g3,.g2{grid-template-columns:1fr}main{padding:14px 12px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0;overflow-x:auto}.hbar .nm{flex:none}@media(max-width:640px){.hbar .nm{width:84px}.hbar .vv{width:48px}th,td{padding:6px 4px;font-size:13px}}
.card h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-bottom:14px;align-items:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.good{color:var(--good)}.base{color:var(--base)}.watch{color:var(--watch)}.risk{color:var(--risk)}.mut{color:var(--mut)}
.bg-good{background:var(--good)}.bg-base{background:var(--base)}.bg-watch{background:var(--watch)}.bg-risk{background:var(--risk)}
.take{border-left:4px solid var(--c);padding:6px 0 6px 14px;margin:10px 0}.take b{display:block;font-size:16px}.take span{color:var(--mut)}
.tile .l{color:var(--mut);font-size:13px}.tile .v{font-size:32px;font-weight:700;line-height:1.15;margin:4px 0}.tile .d{color:var(--mut);font-size:13px}
.tile{border-top:3px solid var(--c)}
.stack{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:8px 0 6px}.stack div{display:flex;align-items:center;justify-content:center;font-weight:700;color:#06101a;font-size:14px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--c,var(--line));color:var(--c,var(--mut));white-space:nowrap}
.tag.solid{background:var(--c);color:#06101a}
ul.b{margin:6px 0 0;padding-left:20px}ul.b li{margin:4px 0}
.bar{height:10px;background:#1d2836;border-radius:5px;position:relative;overflow:hidden}.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-weight:600;font-size:12.5px}
tr.click:hover{background:var(--panel2);cursor:pointer}
button,select{background:var(--panel2);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}button:hover{filter:brightness(1.15)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;border-radius:0;background:transparent;padding:9px 18px}.seg button.on{background:var(--base);color:#06101a;font-weight:700}
details{margin-top:10px}summary{cursor:pointer;color:var(--mut);font-size:13.5px}
input[type=range]{width:100%;accent-color:var(--base)}
.num{font-size:28px;font-weight:700}
.log div{padding:8px 12px;border-left:3px solid var(--good);margin-bottom:6px;background:var(--panel2);border-radius:0 8px 8px 0;animation:in .4s}.log b{color:var(--base)}
@keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1}}
svg text{fill:var(--mut);font-size:11px}
.pill{font-size:11.5px;padding:2px 8px;border-radius:6px;background:#0e141c;border:1px solid var(--line);margin-right:6px;color:var(--mut)}
.hbar{display:flex;align-items:center;gap:10px;margin:7px 0}.hbar .nm{width:100px;font-size:14px}.hbar .tr{flex:1;position:relative;height:22px;background:#17202b;border-radius:6px}.hbar .tr i{position:absolute;top:0;bottom:0;border-radius:6px}.hbar .tr .z{position:absolute;left:30%;top:-2px;bottom:-2px;width:1px;background:#4a5a70}.hbar .vv{width:56px;text-align:right;font-weight:700}
</style>

<body>
<div class="app">
<nav>
  <div class="brand">ABB <b>AlphaGrid</b><small>Spot demand shifts early</small></div>

  <div id="page"></div>
</main>
</div>
<script>/* ABB AlphaGrid — core engine (signals, scoring, scenarios, impact, decisions, 8-agent pipeline).
   Runs in browser and Node. ALL SEED DATA IS ILLUSTRATIVE (anonymised, not real company/ABB figures). */
(function (root) {
  const SCEN = ["HG", "BASE", "RS", "SD"];
  const SCEN_NAME = { HG: "Hyper Growth", BASE: "Base Growth", RS: "Regional Shift", SD: "Market Slowdown" };
  const PRIOR = { HG: 0.15, BASE: 0.50, RS: 0.20, SD: 0.15 };
  const REGIONS = ["Nordics", "USA", "Germany", "UK", "Middle East", "APAC"];

  /* ---------- Data source portfolio ---------- */
  // [id, name, group, why, reliability, freq, leadMonths, abbRelevance]
  const S = (id, name, group, why, rel, freq, lead, abb) => ({ id, name, group, why, rel, freq, lead, abb });
  const SOURCES = [
    S("fred", "FRED (St. Louis Fed)", "Macro", "Industrial construction spending, capacity utilisation, credit spreads", 95, "Monthly", 3, 65),
    S("oecd", "OECD / IMF / World Bank", "Macro", "Capex cycles, AI-investment and digitalisation indicators", 92, "Quarterly", 6, 50),
    S("eia", "EIA", "Energy", "US commercial load growth, utility capex, generation additions", 93, "Monthly", 9, 80),
    S("entsoe", "ENTSO-E / Energy-Charts", "Energy", "EU load, TSO ten-year network plans, demand outlooks", 92, "Hourly / yearly", 18, 85),
    S("iea", "IEA", "Energy", "Data-centre electricity demand scenarios, policy trackers", 90, "Annual + updates", 24, 70),
    S("tso_queue", "TSO/DSO connection queues", "Grid", "Large-load connection requests: the earliest hard signal of MW demand", 90, "Quarterly", 24, 95),
    S("grid_plans", "Grid investment & substation plans", "Grid", "Substation / transmission projects = where ABB MV & protection ships", 88, "Annual", 30, 92),
    S("dcmap", "DataCenterMap", "Data centre", "Facility inventory and announced campuses by geography", 72, "Weekly", 12, 85),
    S("dcd", "DataCenterDynamics", "Data centre", "Project announcements, site acquisitions, power-purchase news", 75, "Daily", 15, 85),
    S("cbre_jll", "CBRE / JLL market reports", "Data centre", "Vacancy, preleasing, under-construction MW by market", 85, "Semi-annual", 6, 80),
    S("hyperscaler_pr", "Hyperscaler announcements & earnings", "Data centre", "Capex guidance, campus announcements, power commitments", 80, "Quarterly / event", 12, 90),
    S("semis", "Nvidia/AMD/TSMC/Intel filings & industry reports", "Technology", "Accelerator shipments, advanced packaging capacity → rack MW 6-12 months out", 88, "Quarterly", 9, 80),
    S("permits", "Permits, zoning & planning portals", "Construction", "Planning filings 9-15 months before energisation", 70, "Weekly (scraped)", 12, 85),
    S("constr", "Industrial construction spending & ENR/Dodge", "Construction", "Concurrent confirmation of build activity", 85, "Monthly", 3, 70),
    S("supply", "Lead-time trackers, Wood Mackenzie/transformer surveys", "Supply chain", "Transformer, switchgear, power-IC lead times and shortages", 75, "Monthly", 12, 92),
    S("commod", "LME copper, steel, freight indexes (Drewry/Baltic)", "Supply chain", "Input-cost and logistics stress", 95, "Daily", 3, 75),
    S("news_rss", "Industry RSS, regulators, policy trackers", "News", "Regulatory changes, moratoria, subsidies, export controls", 65, "Continuous", 9, 70),
    S("peers", "Peer order books (electrical equipment OEM filings)", "Lagging", "Confirms the cycle; ground truth for backtesting", 92, "Quarterly", 0, 90),
    S("social", "Unverified web / social chatter", "News", "Rumours; kept only so Validation Agent can reject them", 25, "Continuous", 1, 30),
  ];

  /* ---------- Scenario loadings per signal archetype ---------- */
  const LOAD = {
    G:  { HG: 0.8, BASE: 0.6, RS: 0.0, SD: -0.55 },   // global growth
    H:  { HG: -0.8, BASE: 0.1, RS: 0.4, SD: 1.2 },    // global headwind
    NG: { HG: 0.5, BASE: 0.2, RS: 0.7, SD: -0.6 },    // regional growth
    RH: { HG: -0.4, BASE: 0.0, RS: 0.7, SD: 0.4 },    // regional headwind
    C:  { HG: 0.3, BASE: 0.0, RS: 0.0, SD: 0.0 },     // cost signal (margin, not volume)
  };

  /* ---------- Signals ----------
     id,title,region,layer,horizon,nature,pol,kind,S,C,rel,lead,abb,U,src,corr,challengedBy,load,new,evidence,products */
  const sig = (o) => Object.assign({ new: false, challengedBy: [], status: null }, o);
  const SIGNALS = [
    sig({ id: "N1", title: "Three hyperscaler campus announcements in Nordics (~0.9 GW aggregate)", region: "Nordics", layer: "Core DC", horizon: "leading", nature: "structural", pol: 1, kind: "growth", S: 82, C: 76, rel: 80, lead: 18, abb: 90, U: 30, src: "hyperscaler_pr", corr: 3, challengedBy: ["N6", "N7", "N8"], load: "NG", new: true, evidence: "Hyperscaler A, B and an AI-cloud provider each named a Nordic site in a 6-week window; two quote power in the hundreds of MW.", products: "MV switchgear, protection relays, LV, monitoring" }),
    sig({ id: "N2", title: "Large-load grid connection requests up ~2.4x QoQ (Nordic TSO/DSO queues)", region: "Nordics", layer: "Enabling", horizon: "leading", nature: "structural", pol: 1, kind: "growth", S: 88, C: 72, rel: 90, lead: 24, abb: 92, U: 28, src: "tso_queue", corr: 2, challengedBy: ["N6"], load: "NG", new: true, evidence: "Queue snapshots show data-centre-tagged requests rising sharply; share of requests >50 MW doubled.", products: "Grid-connection substations, MV GIS, protection & control" }),
    sig({ id: "N3", title: "TSO long-term demand outlook revised up (data-centre load share)", region: "Nordics", layer: "Enabling", horizon: "leading", nature: "structural", pol: 1, kind: "growth", S: 70, C: 80, rel: 92, lead: 36, abb: 78, U: 22, src: "entsoe", corr: 2, load: "NG", new: true, evidence: "Revised 10-year outlook lifts 2030 demand; data centres cited as the largest single driver.", products: "Substation & distribution programmes" }),
    sig({ id: "N4", title: "Municipal construction & zoning filings for data-centre sites", region: "Nordics", layer: "Core DC", horizon: "coincident", nature: "cyclical", pol: 1, kind: "growth", S: 64, C: 62, rel: 70, lead: 12, abb: 85, U: 38, src: "permits", corr: 2, challengedBy: ["N8"], load: "NG", new: true, evidence: "Planning filings for large industrial plots tagged 'data centre' up in 4 municipalities.", products: "LV/MV switchboards, power quality" }),
    sig({ id: "N5", title: "GPU / accelerator demand: shipments and advanced-packaging capacity up again", region: "Global", layer: "Upstream", horizon: "leading", nature: "structural", pol: 1, kind: "growth", S: 75, C: 85, rel: 88, lead: 9, abb: 80, U: 30, src: "semis", corr: 3, load: "G", new: true, evidence: "Latest filings show accelerator revenue and packaging-capacity expansion above prior guidance.", products: "All data-centre electrification" }),
    sig({ id: "N6", title: "Nordic grid constraints: capacity-limited areas and queue backlogs", region: "Nordics", layer: "Enabling", horizon: "coincident", nature: "structural", pol: -1, kind: "warning", S: 72, C: 70, rel: 85, lead: 12, abb: 75, U: 30, src: "tso_queue", corr: 2, load: "RH", new: true, evidence: "Several southern regions have no uncommitted capacity; connection dates pushed to 2029+.", products: "Grid-connection infra (timing risk)" }),
    sig({ id: "N7", title: "Large power transformer lead times > 2 years", region: "Global", layer: "Upstream", horizon: "coincident", nature: "structural", pol: -1, kind: "warning", S: 78, C: 82, rel: 75, lead: 12, abb: 88, U: 25, src: "supply", corr: 3, load: "H" , evidence: "Surveys show 120-150 week delivery for large units; projects slip even when MV equipment is ready.", products: "Delivery sequencing of substations" }),
    sig({ id: "N8", title: "Regulatory & environmental-review delays on large sites", region: "Nordics", layer: "Core DC", horizon: "lagging", nature: "cyclical", pol: -1, kind: "warning", S: 55, C: 55, rel: 65, lead: 9, abb: 60, U: 42, src: "news_rss", corr: 1, load: "RH", new: true, evidence: "Appeals and heat-reuse conditions reported on two proposals; no moratorium yet.", products: "Project timing" }),

    sig({ id: "U1", title: "US utility large-load pipelines keep expanding (with speculative-load filters)", region: "USA", layer: "Enabling", horizon: "leading", nature: "structural", pol: 1, kind: "growth", S: 80, C: 75, rel: 85, lead: 24, abb: 90, U: 30, src: "eia", corr: 3, load: "G", evidence: "Utility IRPs raise load forecasts; new tariffs demand financial commitment, filtering paper projects.", products: "MV GIS, protection, substations" }),
    sig({ id: "U2", title: "Hyperscaler aggregate capex guidance raised again", region: "USA", layer: "Core DC", horizon: "leading", nature: "structural", pol: 1, kind: "growth", S: 85, C: 88, rel: 90, lead: 12, abb: 88, U: 22, src: "hyperscaler_pr", corr: 3, load: "G", evidence: "Latest earnings cycle: guidance up for next 4 quarters.", products: "Full portfolio" }),
    sig({ id: "U3", title: "MV switchgear order lead times extending at peers", region: "USA", layer: "Upstream", horizon: "coincident", nature: "cyclical", pol: 1, kind: "growth", S: 66, C: 75, rel: 80, lead: 6, abb: 95, U: 25, src: "supply", corr: 2, load: "G", evidence: "Peers quoting longer delivery windows: demand outrunning capacity (also a capacity-planning flag for ABB).", products: "MV switchgear capacity" }),
    sig({ id: "U4", title: "AI-infrastructure financing stress: neocloud / DC debt spreads widening", region: "USA", layer: "Downstream", horizon: "leading", nature: "cyclical", pol: -1, kind: "reversal", S: 58, C: 55, rel: 72, lead: 9, abb: 70, U: 45, src: "fred", corr: 2, load: "H", evidence: "Credit spreads for leveraged GPU-cloud borrowers up; two projects reported re-scoping.", products: "Order cancellation / push-out risk" }),
    sig({ id: "G1", title: "Frankfurt-region grid saturation + connection-reform uncertainty", region: "Germany", layer: "Enabling", horizon: "coincident", nature: "structural", pol: -1, kind: "warning", S: 60, C: 68, rel: 80, lead: 12, abb: 80, U: 35, src: "entsoe", corr: 2, load: "RH", evidence: "Operators report multi-year waits for new MW in core markets; new rules still being drafted.", products: "Core-market project timing" }),
    sig({ id: "G2", title: "Sovereign / industrial-AI 'gigafactory' bids in Germany", region: "Germany", layer: "Downstream", horizon: "leading", nature: "cyclical", pol: 1, kind: "growth", S: 55, C: 50, rel: 65, lead: 15, abb: 78, U: 50, src: "news_rss", corr: 1, load: "NG", evidence: "Consortia formed; funding not yet committed (false-positive risk).", products: "Industrial + DC LV/MV" }),
    sig({ id: "K1", title: "UK AI Growth Zones designated + connection-queue reform", region: "UK", layer: "Enabling", horizon: "leading", nature: "structural", pol: 1, kind: "growth", S: 62, C: 66, rel: 75, lead: 18, abb: 80, U: 38, src: "news_rss", corr: 2, load: "NG", evidence: "Priority grid access promised to designated zones; delivery timelines still uncertain.", products: "MV, protection, grid connection" }),
    sig({ id: "M1", title: "Gulf sovereign AI campus MoUs (GW scale) + chip export licences", region: "Middle East", layer: "Downstream", horizon: "leading", nature: "structural", pol: 1, kind: "growth", S: 78, C: 60, rel: 68, lead: 15, abb: 82, U: 48, src: "dcd", corr: 2, load: "NG", evidence: "Multiple GW-scale announcements; execution depends on licences and power build-out.", products: "MV/LV, grid connection, automation" }),
    sig({ id: "A1", title: "APAC: Johor/Singapore power constraints steering new builds regionally", region: "APAC", layer: "Core DC", horizon: "coincident", nature: "structural", pol: 1, kind: "growth", S: 70, C: 72, rel: 78, lead: 12, abb: 80, U: 35, src: "dcmap", corr: 2, load: "NG", evidence: "Pipeline shifting towards Malaysia/Indonesia/India; local content and utilities shape awards.", products: "LV/MV, monitoring" }),
    sig({ id: "C1", title: "Copper price spike and falling exchange inventories", region: "Global", layer: "Upstream", horizon: "coincident", nature: "cyclical", pol: -1, kind: "warning", S: 60, C: 80, rel: 90, lead: 3, abb: 85, U: 20, src: "commod", corr: 3, load: "C", evidence: "Price and inventory trend threaten switchgear/busbar margins; also correlates with strong demand.", products: "Margin exposure on MV/LV" }),
    sig({ id: "T1", title: "Rack power density roadmap: 800 V DC / liquid-cooled racks", region: "Global", layer: "Upstream", horizon: "leading", nature: "structural", pol: 1, kind: "growth", S: 72, C: 70, rel: 75, lead: 18, abb: 85, U: 40, src: "semis", corr: 2, load: "G", evidence: "Next-gen platforms push MW per hall up 3-5x; changes LV/DC distribution mix.", products: "Power distribution, monitoring, power quality" }),
    sig({ id: "S2", title: "Nuclear / SMR co-location PPAs for data centres", region: "USA", layer: "Enabling", horizon: "leading", nature: "structural", pol: 1, kind: "growth", S: 58, C: 55, rel: 70, lead: 24, abb: 70, U: 55, src: "dcd", corr: 1, load: "NG", evidence: "Several behind-the-meter agreements; commissioning dates far out.", products: "Generation-side MV/protection" }),
    sig({ id: "L1", title: "Colocation vacancy at record lows; preleasing > 80 %", region: "USA", layer: "Core DC", horizon: "coincident", nature: "cyclical", pol: 1, kind: "growth", S: 68, C: 85, rel: 85, lead: 3, abb: 70, U: 18, src: "cbre_jll", corr: 3, load: "G", evidence: "Broker reports show record-low vacancy in primary markets.", products: "Near-term order flow" }),
    sig({ id: "L2", title: "Peer electrical-equipment order books at record backlog", region: "Global", layer: "Downstream", horizon: "lagging", nature: "cyclical", pol: 1, kind: "growth", S: 74, C: 90, rel: 92, lead: 0, abb: 90, U: 12, src: "peers", corr: 3, load: "G", evidence: "Confirms cycle strength (lagging; useful for backtesting).", products: "Benchmark" }),
    sig({ id: "F1", title: "Rumour: hyperscaler cancelling multi-GW leases", region: "USA", layer: "Core DC", horizon: "leading", nature: "false_positive", pol: -1, kind: "warning", S: 70, C: 25, rel: 25, lead: 1, abb: 40, U: 80, src: "social", corr: 0, load: "H", evidence: "Single unverified social post, no filings, no broker corroboration, denied in subsequent call.", products: "n/a" }),
  ];

  /* ---------- Scoring ---------- */
  const clamp = (x, a = 0, b = 100) => Math.max(a, Math.min(b, x));
  const r1 = (x) => Math.round(x * 10) / 10;

  function validate(s) {
    const src = SOURCES.find((x) => x.id === s.src);
    const checks = {
      reliability: src.rel >= 60,
      corroboration: s.corr >= 2,
      freshness: true,
      consistency: s.nature !== "false_positive",
    };
    let status = "Validated";
    if (!checks.reliability || s.corr === 0) status = "Rejected";
    else if (!checks.corroboration) status = "Provisional";
    const factor = 0.85 + 0.075 * Math.min(s.corr, 3);
    return { status, checks, factor, srcName: src.name };
  }

  function scoreAll(signals, opts = {}) {
    const strict = opts.counterStrictness == null ? 1 : opts.counterStrictness;
    const base = signals.map((s) => {
      const v = validate(s);
      const leadScore = clamp((s.lead / 24) * 100);
      const conf = clamp(s.C * v.factor);
      return Object.assign({}, s, { validation: v, leadScore, confVal: conf });
    });
    // first pass: raw priority
    const raw = (x, conf) => (0.30 * x.S + 0.20 * conf + 0.15 * x.rel + 0.15 * x.leadScore + 0.20 * x.abb) * (1 - 0.5 * x.U / 100);
    base.forEach((x) => (x.rawPriority = r1(raw(x, x.confVal))));
    // counter-evidence discount
    base.forEach((x) => {
      const ch = x.challengedBy.map((id) => base.find((y) => y.id === id)).filter(Boolean);
      const worst = ch.length ? Math.max(...ch.map((c) => c.rawPriority)) : 0;
      const penalty = 0.35 * strict * (worst / 100);
      x.counterPenalty = r1(penalty * 100);
      x.confAdj = clamp(x.confVal * (1 - penalty));
      x.priority = x.validation.status === "Rejected" ? r1(raw(x, x.confAdj) * 0.2) : r1(raw(x, x.confAdj));
      x.tier = x.validation.status === "Rejected" ? "Rejected" : x.priority >= 62 ? "Act" : x.priority >= 50 ? "Watch" : "Monitor";
    });
    return base;
  }

  /* ---------- Scenario posterior ---------- */
  const K = 0.032;
  function posterior(scored, opts = {}) {
    const include = opts.include || (() => true);
    const warnW = opts.warningWeight == null ? 1 : opts.warningWeight;
    const logit = {}, contrib = {};
    SCEN.forEach((k) => { logit[k] = Math.log(PRIOR[k]); contrib[k] = []; });
    scored.forEach((x) => {
      if (x.validation.status === "Rejected" || !include(x)) return;
      const w = (x.priority / 100) * (x.pol < 0 ? warnW : 1);
      SCEN.forEach((k) => {
        const c = K * w * LOAD[x.load][k] * 10; // 10 = scale so ~20 signals move probabilities visibly
        logit[k] += c;
        contrib[k].push({ id: x.id, title: x.title, c });
      });
    });
    const m = Math.max(...SCEN.map((k) => logit[k]));
    const e = SCEN.map((k) => Math.exp(logit[k] - m));
    const z = e.reduce((a, b) => a + b, 0);
    const p = {};
    SCEN.forEach((k, i) => (p[k] = 0.8 * (e[i] / z) + 0.2 * PRIOR[k])); // 20% shrinkage to prior = model-uncertainty floor
    return { p, contrib };
  }

  function entropyConf(p, scored) {
    const H = -SCEN.reduce((a, k) => a + p[k] * Math.log(p[k] + 1e-9), 0) / Math.log(4);
    const act = scored.filter((x) => x.validation.status !== "Rejected");
    const meanC = act.reduce((a, x) => a + x.confAdj, 0) / act.length;
    const score = clamp(meanC * (1 - 0.45 * H));
    return { score: r1(score), label: score >= 60 ? "High" : score >= 42 ? "Medium" : "Low" };
  }

  /* ---------- Custom data loader ----------
     Merge model: a file can UPDATE existing signals (matched by id), ADD new signals, and REPLACE the news feed.

  let CUSTOM = null;
  const SEED_SIGNALS = JSON.parse(JSON.stringify(SIGNALS));

  const ENUM = { horizon: ["leading", "coincident", "lagging"], nature: ["structural", "cyclical", "false_positive"], kind: ["growth", "warning", "reversal"], layer: ["Core DC", "Enabling", "Upstream", "Downstream"] };

  const REQUIRED = ["id", "title", "region", "layer", "horizon", "nature", "kind", "S", "C", "rel", "lead", "abb", "U", "src", "load"];

  function checkSignal(o, isNew, where, errors) {
    const bad = (m) => errors.push(`${where}: ${m}`);
    if (isNew) REQUIRED.forEach((k) => { if (o[k] === undefined || o[k] === null || o[k] === "") bad(`missing required field "${k}"`); });
    Object.keys(ENUM).forEach((k) => { if (o[k] !== undefined && !ENUM[k].includes(o[k])) bad(`"${k}" must be one of ${ENUM[k].join(" | ")} (got "${o[k]}")`); });
    NUM100.forEach((k) => { if (o[k] !== undefined && !(typeof o[k] === "number" && o[k] >= 0 && o[k] <= 100)) bad(`"${k}" must be a number from 0 to 100`); });
    if (o.lead !== undefined && !(typeof o.lead === "number" && o.lead >= 0)) bad(`"lead" must be a number of months (>= 0)`);
    if (o.corr !== undefined && !(Number.isInteger(o.corr) && o.corr >= 0)) bad(`"corr" must be a whole number >= 0`);
    if (o.region !== undefined && !REGIONS.includes(o.region) && o.region !== "Global") bad(`"region" must be one of ${REGIONS.join(", ")}, Global (got "${o.region}")`);
    if (o.load !== undefined && !(o.load in LOAD)) bad(`"load" must be one of ${Object.keys(LOAD).join(", ")} (got "${o.load}")`);
    if (o.pol !== undefined && o.pol !== 1 && o.pol !== -1) bad(`"pol" must be 1 (supports growth) or -1 (warns)`);
    if (o.challengedBy !== undefined && !Array.isArray(o.challengedBy)) bad(`"challengedBy" must be a list of signal ids`);
  }

  function loadCustom(data) {
    const errors = [];
    if (!data || typeof data !== "object" || Array.isArray(data)) return { ok: false, errors: ["The file must be a JSON object with \"signals\" and/or \"raw_feed\"."] };
    const list = data.signals === undefined ? [] : data.signals, feed = data.raw_feed;
    if (!Array.isArray(list)) errors.push('"signals" must be a list');
    if (feed !== undefined && !Array.isArray(feed)) errors.push('"raw_feed" must be a list');
    if (errors.length) return { ok: false, errors };
    if (!list.length && !(feed && feed.length)) return { ok: false, errors: ["Nothing to load: provide a non-empty \"signals\" or \"raw_feed\" list."] };
    const ids = new Set();
    list.forEach((o, n) => {
      const where = `signals[${n}]${o && o.id ? " (" + o.id + ")" : ""}`;
      if (!o || typeof o !== "object" || !o.id) return errors.push(`${where}: every signal needs an "id"`);
      if (ids.has(o.id)) errors.push(`${where}: duplicate id in file`);
      ids.add(o.id);
      checkSignal(o, !SIGNALS.some((s) => s.id === o.id), where, errors);
      const kind = o.kind || (SIGNALS.find((s) => s.id === o.id) || {}).kind;
      if (o.pol !== undefined && kind && o.pol !== (kind === "growth" ? 1 : -1)) errors.push(`${where}: "pol" ${o.pol} does not match kind "${kind}" (growth = 1, warning/reversal = -1)`);
    });
    (feed || []).forEach((r, n) => { if (!r || !r.t || !r.src) errors.push(`raw_feed[${n}]: needs "t" (headline text) and "src" (source name)`); });
    if (errors.length) return { ok: false, errors };
    let updated = 0, added = 0;
    list.forEach((o) => {
      const cur = SIGNALS.find((s) => s.id === o.id);
      if (cur) { Object.assign(cur, o); updated++; }
      else { SIGNALS.push(sig(Object.assign({ pol: o.kind === "growth" ? 1 : -1, corr: 1, new: true, evidence: "", products: "" }, o))); added++; }
    });
    if (feed && feed.length) { RAW_FEED.length = 0; feed.forEach((r) => RAW_FEED.push({ t: r.t, src: r.src, maps: r.maps || "" })); }
    CUSTOM = { updated, added, feed: feed ? feed.length : 0 };
    return Object.assign({ ok: true }, CUSTOM);
  }

  function resetCustom() {
    SIGNALS.length = 0; JSON.parse(JSON.stringify(SEED_SIGNALS)).forEach((s) => SIGNALS.push(s));
    RAW_FEED.length = 0; JSON.parse(JSON.stringify(SEED_FEED)).forEach((r) => RAW_FEED.push(r));

  /* ---------- 8-agent pipeline (deterministic core; LLM augments text extraction & narrative in production) ---------- */
  function runPipeline(opts = {}) {
    const log = [];
    const baselineSignals = SIGNALS.filter((s) => !s.new);
    const t0 = scoreAll(baselineSignals);

    log.push({ agent: "Market Intelligence", out: `Ingested ${RAW_FEED.length} new items from 8 sources; entity-resolved to ${RAW_FEED.filter((r) => r.maps !== "F1").length} candidate signals + 1 rumour.` });
    const rawScored = scoreAll(SIGNALS, { counterStrictness: 0 });
    const newGrowth = rawScored.filter((x) => x.new && x.pol > 0);
    const regCount = {}; newGrowth.forEach((x) => { regCount[x.region] = (regCount[x.region] || 0) + 1; });
    const topReg = Object.keys(regCount).sort((a, b) => regCount[b] - regCount[a])[0];

      why: [

<script>

P.outlook = () => {

  const scd = E.scoreAll(E.SIGNALS, { counterStrictness: sw.strict }), post = E.posterior(scd, { warningWeight: sw.warn, include: s => !sw.off[s.id] });
  return `${intro("Scenarios", "Four possible futures. Each card says what it means, how likely it is, why, and what it does to ABB.")}
  <div class="card"><h3>Probabilities</h3>${stack(R.post.p, R.pBefore)}</div>
  <div class="grid g2" style="margin-top:14px">${E.SCEN.map(card).join("")}</div>
  <details class="card" style="margin-top:14px" ${sw.open ? "open" : ""} ontoggle="sw.open=this.open"><summary><b>What if…?</b> Test how the probabilities change</summary>
    <div class="grid g2" style="margin-top:12px"><div>
      <div>How much to trust warning signs: <b>${sw.warn.toFixed(1)}×</b></div><input type="range" min="0" max="2.5" step=".1" value="${sw.warn}" oninput="sw.warn=+this.value;render()">
      <div style="margin-top:10px">How hard to challenge good news: <b>${sw.strict.toFixed(1)}×</b></div><input type="range" min="0" max="2.5" step=".1" value="${sw.strict}" oninput="sw.strict=+this.value;render()">
      <div class="mut" style="margin:10px 0 4px">Click a signal to switch it off:</div>${E.SIGNALS.filter(s => s.nature !== "false_positive").map(s => `<span class="pill" style="cursor:pointer;${sw.off[s.id] ? "opacity:.35;text-decoration:line-through" : ""}" onclick="sw.off['${s.id}']=!sw.off['${s.id}'];render()">${E.shortName(s.id)}</span>`).join(" ")}
      <p><button onclick="sw={warn:1,strict:1,off:{},open:true};render()">Reset</button></p></div>
    <div>${probBars(post.p, R.pBefore)}</div></div></details>`;
};

let geoScn = "EXP";
P.geo = () => {
  const val = (r) => geoScn === "EXP" ? R.outlook && E.expectedImpact(R.post.p).regions[r] : E.REG_IMPACT[geoScn][r];
  const rows = E.REGIONS.map(r => ({ name: r, v: val(r) })).sort((a, b) => b.v - a.v);
  const avg = geoScn === "EXP" ? R.impact.orderGrowth : E.SCEN_INFO[geoScn].orders;
  const vcol = { Winner: "good", Steady: "base", Lagging: "watch" };
  return `${intro("Regions", "Where ABB demand is growing and where it is lagging. Orders vs 2026 over the next 18 months.")}
  <div class="row" style="margin-bottom:14px"><span class="mut">Show:</span><select onchange="geoScn=this.value;render()"><option value="EXP" ${geoScn === "EXP" ? "selected" : ""}>Most likely (weighted)</option>${E.SCEN.map(k => `<option value="${k}" ${geoScn === k ? "selected" : ""}>${E.SCEN_NAME[k]}</option>`).join("")}</select></div>
  <div class="card"><h3>Order growth by region (average: ${sgn(avg)}%)</h3>${hbars(rows, 70)}</div>
  <h2>Region scorecards</h2>
  <div class="grid g3">${R.regions.map(r => `<div class="card" style="border-top:3px solid ${CV[r.change < 0 ? "risk" : vcol[r.verdict]]}"><div class="row"><b style="font-size:17px">${r.region}</b><span class="sp"></span><span class="tag" style="--c:${CV[vcol[r.verdict]]}">${r.verdict}</span></div>
    <div class="num" style="margin:6px 0">${chg(r.change)}</div><div class="mut" style="font-size:13px">Early-warning strength: ${r.momentum}/100</div><div class="bar" style="margin:4px 0 10px"><i style="width:${r.momentum}%;background:var(--base)"></i></div>
    ${bullets([`<b>Held back by:</b> ${r.limit}`, `<b>ABB move:</b> ${r.action}`])}</div>`).join("")}</div>
  <h2>Compare across scenarios</h2>
  <div class="card"><table><tr><th>Region</th>${E.SCEN.map(k => `<th style="color:${sc(k)}">${E.SCEN_NAME[k]}</th>`).join("")}</tr>
  ${E.REGIONS.map(r => `<tr><td><b>${r}</b></td>${E.SCEN.map(k => { const v = E.REG_IMPACT[k][r]; const c = v < 0 ? CV.risk : CV.good; return `<td style="background:color-mix(in srgb,${c} ${Math.min(55, Math.abs(v) * 0.9)}%,transparent);font-weight:600">${sgn(v)}%</td>`; }).join("")}</tr>`).join("")}</table></div>`;
};

P.dec = () => {
  const D = R.decisions, lab = { Manufacturing: "Factories", Procurement: "Buying", "Supply chain": "Supply chain", Strategy: "Strategy" };
  const nice = (o) => o.split(" (")[0];
  return `${intro("Decisions", "One recommended move for each area. It is chosen to work reasonably well whichever future happens.")}
  <div class="grid g2">${Object.keys(D).map(dom => { const r = D[dom][0]; return `<div class="card" style="border-top:3px solid var(--good)"><div class="row"><h3 style="margin:0">${lab[dom]}</h3><span class="sp"></span><span class="tag solid" style="--c:${CV.good}">Recommended</span></div>
    <div style="font-size:18px;font-weight:600;margin:8px 0">${nice(r.opt)}</div>
    ${bullets([`If growth surges: ${chg(r.pay.HG, " pts")}`, `If the market slows: ${chg(r.pay.SD, " pts")}`, `Expected overall: ${chg(r.ev, " pts")}`])}
    <details><summary>Compare with other options</summary><table><tr><th>Option</th><th>Surge</th><th>Slowdown</th><th>Overall</th></tr>${D[dom].slice(1).map(o => `<tr><td>${nice(o.opt)}</td><td>${chg(o.pay.HG)}</td><td>${chg(o.pay.SD)}</td><td>${chg(o.ev, "")}</td></tr>`).join("")}</table><div class="mut" style="font-size:12px;margin-top:6px">Points = illustrative margin contribution. Ranked on expected result minus the cost of being wrong.</div></details></div>`; }).join("")}</div>
  <h2>Who does what next</h2><div class="card"><table><tr><th>Owner</th><th>Action</th><th>By</th></tr>${R.brief.next.map(n => `<tr><td><b>${n.who}</b></td><td>${n.what}</td><td>${n.due}</td></tr>`).join("")}</table></div>
  <h2>Triggers that change our plan</h2><div class="grid g2">${R.tripwires.map(t => `<div class="card"><div><span class="tag" style="--c:${CV.watch}">IF</span> ${t.if}</div><div style="margin-top:8px"><span class="tag" style="--c:${CV.good}">THEN</span> ${t.then}</div></div>`).join("")}</div>`;
};

P.radar = () => {
  const W = 560, cx = 280, cy = 280, layers = ["Upstream", "Core DC", "Downstream", "Enabling"], nm = { Upstream: "Chips & materials", "Core DC": "Data centres", Downstream: "AI demand & money", Enabling: "Power & grid" };
  const scd = R.scored.filter(s => s.tier !== "Rejected"), rad = (p) => 40 + (1 - (p - 35) / 50) * 210;
  let svg = `<svg viewBox="0 0 ${W} ${W}" style="width:100%;max-width:640px">`;
  [["Act now", 62], ["Watch", 50], ["Background", 35]].forEach(([n, p]) => { svg += `<circle cx="${cx}" cy="${cy}" r="${rad(p)}" fill="none" stroke="#243040" stroke-dasharray="3 4"/><text x="${cx + 4}" y="${cy - rad(p) + 12}">${n}</text>`; });
  layers.forEach((l, i) => { const a0 = i * Math.PI / 2 - Math.PI / 2, am = a0 + Math.PI / 4; svg += `<line x1="${cx}" y1="${cy}" x2="${cx + 260 * Math.cos(a0)}" y2="${cy + 260 * Math.sin(a0)}" stroke="#243040"/><text x="${cx + 235 * Math.cos(am) - 30}" y="${cy + 235 * Math.sin(am)}" style="fill:#b6c2d1;font-weight:600">${nm[l]}</text>`; });
  layers.forEach((l, i) => { const xs = scd.filter(s => s.layer === l); xs.forEach((s, j) => { const a = i * Math.PI / 2 - Math.PI / 2 + (j + 1) / (xs.length + 1) * Math.PI / 2, r = rad(s.priority), x = cx + r * Math.cos(a), y = cy + r * Math.sin(a), sz = 5 + s.lead / 5;
    svg += `<g onclick="pick('${s.id}')" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${sz}" fill="${s.pol > 0 ? "#2ecc8f" : "#ff4d57"}" fill-opacity=".8" stroke="${s.id === picked ? "#fff" : s.new ? "#ffc233" : "none"}" stroke-width="2.5"/><text x="${x + sz + 2}" y="${y + 3}" style="fill:#e6ebf1">${s.id}</text></g>`; }); });
  svg += `</svg>`;
  const top = scd.slice().sort((a, b) => b.priority - a.priority).slice(0, 8);
  return `${intro("Signals", "Early clues about future demand. Closer to the centre = stronger signal. Green = good news, red = warning.")}
  <div class="grid" style="grid-template-columns:3fr 2fr"><div class="card">${svg}<div class="mut" style="font-size:12.5px">Bigger dot = warns us earlier. Yellow ring = new this cycle.</div></div><div class="card"><h3>Why this signal matters</h3>${sigDetail(R.scored.find(s => s.id === picked))}</div></div>
  <h2>Strongest signals</h2><div class="card"><table><tr><th>Signal</th><th>Type</th><th>Strength</th><th>Status</th></tr>${top.map(s => { const [d, dc] = SIGDIR(s); return `<tr class="click" onclick="pick('${s.id}')"><td><b>${E.shortName(s.id)}</b><div class="mut" style="font-size:12.5px">${s.region}</div></td><td class="${dc}">${d}</td><td><b>${s.priority}</b></td><td><span class="tag" style="--c:${s.tier === "Act" ? CV.risk : s.tier === "Watch" ? CV.watch : "var(--mut)"}">${E.PLAIN[s.tier]}</span></td></tr>`; }).join("")}</table></div>
  <details class="card" style="margin-top:14px"><summary>Rejected signals (kept for transparency)</summary>${bullets(R.scored.filter(s => s.tier === "Rejected").map(s => `<b>${E.shortName(s.id)}</b>: only one unverified source, no confirmation, so it is ignored.`))}</details>`;
};

const SUPPLY = [
  ["Large power transformers", "weeks", [70, 80, 95, 110, 120, 128, 135, 140], "risk", "Find second suppliers; plan deliveries around site power-on dates", "Delays projects, rarely cancels them"],
  ["Medium-voltage switchgear", "weeks", [30, 32, 36, 40, 44, 46, 50, 52], "watch", "Add flexible capacity; assemble closer to customers", "Not enough capacity if growth surges"],
  ["Copper price", "index", [100, 104, 110, 108, 118, 124, 129, 133], "watch", "Buy ahead for 30-50% of needs; index prices in contracts", "Squeezes margins on fixed-price deals"],
  ["Power chips", "weeks", [26, 25, 24, 24, 25, 27, 28, 30], "watch", "Qualify a second source for key parts", "Competes with AI chip makers for capacity"],
  ["Electrical steel", "index", [100, 101, 103, 105, 106, 108, 109, 111], "good", "No action; keep monitoring", "Low concern"],
  ["Shipping costs", "index", [100, 96, 94, 95, 97, 99, 101, 100], "good", "No action", "Back to normal"],
];
P.supply = () => {
  const lab = { risk: "High risk", watch: "Watch", good: "OK" };
  const spark = (a, c) => { const mx = Math.max(...a), mn = Math.min(...a); return `<svg viewBox="0 0 120 34" style="width:130px;height:36px"><polyline fill="none" stroke="${c}" stroke-width="2.5" points="${a.map((v, i) => `${i * 17},${32 - (v - mn) / (mx - mn || 1) * 28}`).join(" ")}"/></svg>`; };
  return `${intro("Supply risks", "Parts and materials that could slow ABB's deliveries or squeeze margins. Trend shows the last 8 quarters (illustrative).")}
  <div class="grid g3">${SUPPLY.map(s => `<div class="card" style="border-top:3px solid ${CV[s[3]]}"><div class="row"><b>${s[0]}</b><span class="sp"></span><span class="tag" style="--c:${CV[s[3]]}">${lab[s[3]]}</span></div>
  <div class="row" style="margin:6px 0"><span class="num">${s[2][7]}</span><span class="mut">${s[1]}</span><span class="sp"></span>${spark(s[2], CV[s[3]])}</div>
  ${bullets([`<b>Impact:</b> ${s[5]}`, `<b>Response:</b> ${s[4]}`])}</div>`).join("")}</div>
  <div class="card" style="margin-top:14px;border-left:4px solid ${CV.watch}"><b>Why it matters for the scenarios</b>${bullets(["Long transformer waits move sales from one quarter to a later one.", "If waits stay above 150 weeks, Regional Shift becomes more likely (about +5-8 points).", "That is why the plan includes second suppliers and extra stock."])}</div>`;
};

let srcF = "All";
P.hub = () => {
  const groups = ["All", ...new Set(E.SOURCES.map(s => s.group))];
  const sig = (h) => R.scored.filter(s => s.horizon === h && s.tier !== "Rejected").sort((a, b) => b.priority - a.priority).slice(0, 6);
  return `${intro("Data & sources", "The public data behind the signals, and how early each type of clue warns us.")}
  <div class="grid g3">${[["leading", "Early warnings (12-36 months ahead)", "base"], ["coincident", "Happening now (0-12 months)", "watch"], ["lagging", "Confirmations (already visible)", "good"]].map(([h, l, c]) => `<div class="card" style="border-top:3px solid ${CV[c]}"><h3>${l}</h3>${bullets(sig(h).map(s => `<span class="${s.pol > 0 ? "good" : "risk"}">${s.pol > 0 ? "▲" : "▼"}</span> ${E.shortName(s.id)}`))}</div>`).join("")}</div>
  <div class="row" style="margin:24px 0 8px"><h2 style="margin:0">Where the data comes from</h2><span class="sp"></span><select onchange="srcF=this.value;render()">${groups.map(g => `<option ${g === srcF ? "selected" : ""}>${g}</option>`).join("")}</select></div>
  <div class="card"><table><tr><th>Source</th><th>What it tells us</th><th>Trust</th><th>Updates</th><th>Warns ahead by</th></tr>${E.SOURCES.filter(s => srcF === "All" || s.group === srcF).map(s => `<tr><td><b>${s.name}</b></td><td>${s.why}</td><td><span class="${s.rel >= 85 ? "good" : s.rel >= 60 ? "watch" : "risk"}">${s.rel >= 85 ? "High" : s.rel >= 60 ? "Medium" : "Low"}</span></td><td>${s.freq}</td><td>${s.lead} mo</td></tr>`).join("")}</table></div>
  <details class="card" style="margin-top:14px"><summary>Latest news items processed</summary><table>${E.RAW_FEED.map(r => `<tr><td>${r.t}</td><td class="mut">${r.src}</td></tr>`).join("")}</table></details>`;
};

let demoState = 0, timer = null;
P.demo = () => `${intro("Live demo: Nordic AI investment surge", "Watch eight AI agents turn new data into a recommendation.")}
  <div class="row" style="margin-bottom:14px"><button class="primary" onclick="runDemo()">▶ Inject new data</button><button onclick="demoState=0;clearTimeout(timer);render()">Reset</button></div>
  <div class="grid g2"><div class="card"><h3>1 · New data arrives</h3>${demoState >= 1 ? bullets(E.RAW_FEED.map(r => `${r.t} <span class="mut">(${r.src})</span>`)) : `<span class="mut">Waiting…</span>`}</div>
  <div class="card"><h3>2 · Agents at work</h3><div class="log">${R.log.slice(0, Math.max(0, demoState - 1)).map(l => `<div><b>${l.agent}</b><br>${l.out}</div>`).join("") || `<span class="mut">Waiting…</span>`}</div></div></div>
  ${demoState >= 9 ? `<div class="grid g2" style="margin-top:14px"><div class="card"><h3>3 · Result: how likely is each future?</h3>${probBars(R.post.p, R.pBefore)}</div>
  <div class="card"><h3>4 · What it means for ABB</h3>${bullets([`Orders ${sgn(R.outlook.m18.growth)}% in 18 months`, `Nordics ${sgn(R.impact.regions.Nordics)}%, Middle East ${sgn(R.impact.regions["Middle East"])}%, USA ${sgn(R.impact.regions.USA)}%`, `Factory use about ${R.outlook.m18.util}%`])}<h3 style="margin-top:14px">5 · Recommended actions</h3>${bullets(R.brief.next.map(n => `<b>${n.who}:</b> ${n.what} (${n.due})`))}</div></div>
  <p><button onclick="go('exec')">Open the executive summary →</button></p>` : ""}`;
function runDemo() { clearTimeout(timer); demoState = 1; render(); const step = () => { demoState++; render(); if (demoState < 9) timer = setTimeout(step, 900); }; timer = setTimeout(step, 900); }

/* ---------- custom data loading ---------- */
function custMsg(t, bad) { const el = $("#custmsg"); el.textContent = t; el.style.color = bad ? "#ff8a80" : "#7be0a0"; }
function onCustomFile(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    let data; try { data = JSON.parse(rd.result); } catch (e) { return custMsg("Not valid JSON: " + e.message, true); }
    const r = E.loadCustom(data);
    if (!r.ok) return custMsg("Nothing loaded. Fix these and retry:\n- " + r.errors.slice(0, 8).join("\n- ") + (r.errors.length > 8 ? `\n(+${r.errors.length - 8} more)` : ""), true);
    refreshAll(); custMsg(`Loaded ${f.name}: ${r.updated} signals updated, ${r.added} added, ${r.feed} news items. Open "Live demo" and press Inject new data.`);
  };
  rd.readAsText(f); ev.target.value = "";
}
function refreshAll() { clearTimeout(timer); demoState = 0; R = buildR(); render(); }
function resetData() { E.resetCustom(); refreshAll(); custMsg("Back to the built-in demo data."); }
function downloadTemplate() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(E.customTemplate(), null, 2)], { type: "application/json" }));
  a.download = "signal-tower-custom-data.json"; a.click(); URL.revokeObjectURL(a.href);
}

function render() { $("#page").innerHTML = (P[cur] || P.exec)(); }
menu(); render();
</script>
</body>
